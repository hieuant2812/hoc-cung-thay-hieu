<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vào dự thi · Học cùng Thầy Hiếu</title>
<link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script src="assets/katex/katex.min.js"></script>
<style>
:root{--nen:#0e1626;--the:#152338;--vien:#22324e;--vang:#ffd66b;--ngoc:#7fd1c1;--cam:#ff9e7d;--luc:#9bd66b;--tim:#c3a6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--nen);color:#eef3ff;font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,sans-serif;
  min-height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--the);border-bottom:1px solid var(--vien);display:flex;align-items:center;gap:10px}
header b{font-size:16px;color:var(--vang)}
header .toi{margin-left:auto;font-size:14px;color:var(--ngoc);text-align:right}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0 0 4px}
.muted{color:#8fb3e8;font-size:14px}
.tim{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--vien);background:#101c30;color:#fff;font-size:17px}
.ds{display:grid;gap:8px;max-height:58vh;overflow:auto;padding-bottom:4px}
.ten{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;background:var(--the);
  border:1px solid var(--vien);font-size:17px;cursor:pointer}
.ten:active{background:#1d3050}
.ten.roi{opacity:.4}
.ten .to{margin-left:auto;font-size:13px;color:var(--ngoc)}
.pa{display:grid;gap:12px}
.pa button{display:flex;gap:14px;align-items:center;text-align:left;padding:18px 16px;border-radius:16px;
  border:2px solid var(--vien);background:var(--the);color:#eef3ff;font:inherit;font-size:18px;width:100%}
.pa button i{flex:none;width:40px;height:40px;border-radius:50%;background:#2b4068;display:grid;place-items:center;
  font-style:normal;font-weight:800;font-size:19px}
.pa button:disabled{opacity:.55}
.pa button.chon{border-color:var(--vang);background:#2a3a22}
.pa button.dung{border-color:#2fbf78;background:#15503a}
.pa button.sai{border-color:#e2566f;background:#54202b}
.to-lon{font-size:clamp(34px,13vw,60px);font-weight:800;text-align:center;color:var(--vang);margin:6px 0}
.cho{text-align:center;padding:30px 10px}
.cho .vong{width:62px;height:62px;border:5px solid var(--vien);border-top-color:var(--vang);border-radius:50%;
  margin:0 auto 16px;animation:xoay 1s linear infinite}
@keyframes xoay{to{transform:rotate(360deg)}}
.bao{padding:14px 16px;border-radius:12px;background:var(--the);border-left:5px solid var(--vang);font-size:15px}
.bao.do{border-color:#e2566f}.bao.xanh{border-color:#2fbf78}
.diem{display:flex;gap:10px;justify-content:center;margin-top:8px}
.diem div{background:var(--the);border-radius:12px;padding:10px 16px;text-align:center;min-width:88px}
.diem b{display:block;font-size:24px;color:var(--vang)}
.diem span{font-size:12px;color:#8fb3e8}
.nut{padding:14px;border-radius:14px;border:0;background:var(--vang);color:#15233a;font:700 17px inherit;width:100%}
.loai{text-align:center;padding:24px 10px}
.loai .ic{font-size:54px}
footer{padding:10px 16px;text-align:center;font-size:12px;color:#5f7aa8}
.de{font-size:17px;line-height:1.5;background:var(--the);border-radius:14px;padding:14px 16px}
</style>
</head>
<body>
<header><b id="tieu">Vào dự thi</b><span class="toi" id="toi"></span></header>
<main id="man"></main>
<footer>Phát triển bởi Thầy Hiếu - GV Toán Trường THPT An Nhơn Tây - TP.HCM</footer>
<script>
(function(){
  const $=id=>document.getElementById(id), man=$("man");
  const q=new URLSearchParams(location.search); const MA=q.get("ma")||"";
  const K="hs-"+MA; let toi=null, lastCau=-1, chonRoi=null;
  const T=s=>{ // hiện công thức toán
    const d=document.createElement("div"); d.textContent=String(s==null?"":s);
    let h=d.innerHTML;
    h=h.replace(/\$([^$]+)\$/g,(m,x)=>{ try{return katex.renderToString(x,{throwOnError:false})}catch(e){return m} });
    return h;
  };
  const api=async(du,o)=>{ const r=await fetch(du,o?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}:{cache:"no-store"});
    const j=await r.json().catch(()=>({loi:"Mất kết nối với máy chủ lớp."})); if(!r.ok) throw new Error(j.loi||"Lỗi"); return j; };
  try{ toi=JSON.parse(localStorage.getItem(K)||"null"); }catch(e){}

  function bao(k,t){ return `<div class="bao ${k}">${t}</div>`; }
  async function chonTen(){
    let d;
    try{ d=await api("/api/danh-sach?ma="+encodeURIComponent(MA)); }
    catch(e){ man.innerHTML=bao("do",e.message+"<br>Em thử quét lại mã QR trên màn hình nhé."); return; }
    $("tieu").textContent="Chọn tên của em";
    man.innerHTML=`<div><h1>Lớp đang thi</h1><p class="muted">Phòng ${MA} · chọn đúng tên của em trong danh sách</p></div>
      <input class="tim" id="tim" placeholder="Gõ vài chữ trong tên để tìm nhanh…">
      <div class="ds" id="ds"></div>`;
    const ve=()=>{
      const k=($("tim").value||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      $("ds").innerHTML=d.ds.filter(x=>{
        const t=x.ten.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
        return !k||t.includes(k);
      }).map(x=>`<div class="ten${x.roi?" roi":""}" data-t="${x.ten.replace(/"/g,"&quot;")}">${x.ten}${x.to?`<span class="to">${x.to}</span>`:""}${x.roi?`<span class="to">đã vào</span>`:""}</div>`).join("")
        ||`<p class="muted">Không tìm thấy tên nào khớp.</p>`;
      $("ds").querySelectorAll(".ten").forEach(e=>e.onclick=()=>vao(e.dataset.t));
    };
    $("tim").oninput=ve; ve();
  }
  async function vao(ten){
    try{
      const r=await api("/api/vao",{ma:MA,ten});
      toi={id:r.id,ten:r.ten,to:r.to}; localStorage.setItem(K,JSON.stringify(toi));
      vong();
    }catch(e){ man.innerHTML=bao("do",e.message)+`<button class="nut" onclick="location.reload()">Thử lại</button>`; }
  }
  const TEN_TRO={rungchuong:"Rung chuông vàng",trieuphu:"Ai là triệu phú",duaxe:"Đua xe tiếp sức",manhghep:"Mảnh ghép bí ẩn",vongquay:"Vòng quay may mắn",bingo:"Bingo Toán",ongtimmat:"Ong tìm mật",duonglen:"Đường lên đỉnh",latthe:"Lật thẻ ghi nhớ",khobau:"Săn kho báu"};
  function dauTrang(t){
    $("tieu").textContent=TEN_TRO[t.tro]||"Đang dự thi"; $("toi").innerHTML=toi?`${toi.ten}${toi.to?" · "+toi.to:""}<br><b style="color:var(--vang)">${t.toi?t.toi.diem:0} điểm</b>`:""; }

  async function vong(){
    let t;
    try{ t=await api(`/api/trang-thai?ma=${encodeURIComponent(MA)}&id=${encodeURIComponent(toi.id)}`); }
    catch(e){ man.innerHTML=bao("do",e.message); setTimeout(vong,2500); return; }
    if(!t.toi){ localStorage.removeItem(K); toi=null; chonTen(); return; }
    dauTrang(t);
    if(!t.toi.con){
      man.innerHTML=`<div class="loai"><div class="ic">🌟</div><h1>Em đã dừng cuộc chơi</h1>
        <p class="muted">Cổ vũ các bạn còn lại nhé! Điểm của em: <b style="color:var(--vang)">${t.toi.diem}</b></p>
        <p class="muted">Còn ${t.con} bạn đang thi.</p></div>`;
      setTimeout(vong,2000); return;
    }
    if(t.cau){
      const c=t.cau;
      if(c.so!==lastCau){ lastCau=c.so; chonRoi=null; veCau(c,t); }
      else capNhat(c,t);
      setTimeout(vong,900); return;
    }
    man.innerHTML=`<div class="cho"><div class="vong"></div>
      <h1>Sẵn sàng!</h1><p class="muted">Chờ thầy cô ra câu hỏi…</p>
      <div class="diem"><div><b>${t.toi.diem}</b><span>điểm của em</span></div><div><b>${t.con}</b><span>bạn đang thi</span></div></div></div>`;
    setTimeout(vong,1200);
  }
  function veCau(c,t){
    const n=c.n||4, CHU="ABCD";
    man.innerHTML=`<div class="muted">Câu ${c.so}</div>
      ${c.de?`<div class="de">${T(c.de)}</div>`:`<p class="muted">Nhìn lên màn chiếu để đọc đề, rồi chọn đáp án:</p>`}
      <div class="pa" id="pa">${Array.from({length:n},(_,k)=>`<button data-k="${k}"><i>${CHU[k]}</i><span>${c.pa&&c.pa[k]?T(c.pa[k]):"Phương án "+CHU[k]}</span></button>`).join("")}</div>
      <div id="kq"></div>`;
    $("pa").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      if(chonRoi!=null) return;
      chonRoi=+b.dataset.k;
      $("pa").querySelectorAll("button").forEach(x=>{x.disabled=true});
      b.classList.add("chon");
      if(navigator.vibrate) navigator.vibrate(40);
      try{ await api("/api/tra-loi",{ma:MA,id:toi.id,chon:chonRoi}); $("kq").innerHTML=bao("","Đã gửi đáp án. Chờ thầy cô công bố…"); }
      catch(e){ $("kq").innerHTML=bao("do",e.message); }
    });
  }
  function capNhat(c,t){
    if(chonRoi==null&&t.toi.chon!=null){ chonRoi=t.toi.chon; }
    if(c.dapan!=null&&$("pa")){
      const bs=$("pa").querySelectorAll("button");
      bs.forEach((b,k)=>{ b.disabled=true; if(k===+c.dapan)b.classList.add("dung"); else if(k===chonRoi)b.classList.add("sai"); });
      if($("kq")&&!$("kq").dataset.xong){
        $("kq").dataset.xong="1";
        $("kq").innerHTML=t.toi.dung?bao("xanh","🎉 Chính xác! Em được cộng điểm."):bao("do",chonRoi==null?"Em chưa kịp trả lời câu này.":"Chưa đúng. Cố lên câu sau nhé!");
      }
    }
  }
  if(!MA){ man.innerHTML=bao("do","Thiếu mã phòng thi. Em quét mã QR trên màn chiếu của lớp nhé."); }
  else if(toi&&toi.id){ vong(); } else chonTen();
})();
</script>
</body>
</html>
